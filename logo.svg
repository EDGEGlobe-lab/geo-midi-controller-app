<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <style>
      .neon-green { fill: #39FF14; }
      .neon-blue { fill: #00FFFF; }
      .neon-cyan { fill: #00FFFF; }
      .neon-magenta { fill: #FF00FF; }
      .white-shine { fill: #FFFFFF; }
      .black-pupil { fill: #000000; }
      .gold-diamond { fill: #FFD700; }
      .star-color { fill: #87CEEB; }
    </style>
    <!-- Radial gradient for cosmic background with stars and planets -->
    <radialGradient id="cosmicGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0d001a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000011;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Cosmic Background - Chandra X-ray Observatory Inspired -->
  <rect width="200" height="200" fill="url(#cosmicGradient)"/>
  
  <!-- Distant Nebula Wisps -->
  <ellipse cx="30" cy="40" rx="50" ry="60" fill="#FF1493" opacity="0.15"/>
  <ellipse cx="170" cy="160" rx="45" ry="50" fill="#00FFFF" opacity="0.12"/>
  <ellipse cx="100" cy="30" rx="60" ry="40" fill="#FFD700" opacity="0.1"/>
  
  <!-- Background Stars -->
  <circle cx="20" cy="25" r="1" class="star-color" opacity="0.8"/>
  <circle cx="45" cy="15" r="0.8" class="white-shine" opacity="0.7"/>
  <circle cx="70" cy="35" r="1.2" class="star-color" opacity="0.6"/>
  <circle cx="95" cy="20" r="0.7" class="white-shine" opacity="0.8"/>
  <circle cx="130" cy="40" r="1" class="star-color" opacity="0.7"/>
  <circle cx="160" cy="30" r="0.9" class="white-shine" opacity="0.6"/>
  <circle cx="180" cy="55" r="1.1" class="star-color" opacity="0.8"/>
  
  <circle cx="25" cy="165" r="0.8" class="white-shine" opacity="0.7"/>
  <circle cx="60" cy="180" r="1" class="star-color" opacity="0.8"/>
  <circle cx="100" cy="190" r="0.9" class="white-shine" opacity="0.6"/>
  <circle cx="150" cy="175" r="1.2" class="star-color" opacity="0.7"/>
  <circle cx="185" cy="160" r="0.7" class="white-shine" opacity="0.8"/>
  
  <!-- Planets in Background -->
  <circle cx="25" cy="120" r="8" fill="#FF6347" opacity="0.4"/>
  <circle cx="165" cy="90" r="6" fill="#4169E1" opacity="0.35"/>
  <circle cx="50" cy="70" r="5" fill="#FFB6C1" opacity="0.3"/>
  
  <!-- X-ray Style Energy Bursts -->
  <circle cx="180" cy="20" r="3" fill="#FF00FF" opacity="0.3"/>
  <circle cx="15" cy="80" r="2.5" fill="#00FFFF" opacity="0.25"/>
  
  <!-- Main Blueberry Body - Neon Green Solid -->
  <circle cx="100" cy="110" r="65" class="neon-green" opacity="0.95"/>
  
  <!-- Blueberry Depth Shading -->
  <ellipse cx="100" cy="75" rx="55" ry="35" class="neon-green" opacity="0.4"/>
  
  <!-- Blueberry Gloss/Shine Effect -->
  <ellipse cx="85" cy="70" rx="25" ry="20" class="white-shine" opacity="0.25"/>
  
  <!-- Left Eye Socket (Dark Background) -->
  <circle cx="75" cy="95" r="18" fill="#1a1a2e" opacity="0.9"/>
  
  <!-- Right Eye Socket (Dark Background) -->
  <circle cx="125" cy="95" r="18" fill="#1a1a2e" opacity="0.9"/>
  
  <!-- Left Neon Blue Eye (iris) -->
  <circle cx="75" cy="95" r="13" class="neon-blue" opacity="0.95"/>
  
  <!-- Right Neon Blue Eye (iris) -->
  <circle cx="125" cy="95" r="13" class="neon-blue" opacity="0.95"/>
  
  <!-- Left Eye Pupil -->
  <circle cx="76" cy="96" r="8" class="black-pupil"/>
  
  <!-- Right Eye Pupil -->
  <circle cx="126" cy="96" r="8" class="black-pupil"/>
  
  <!-- Left Eye White Sparkle (Large) -->
  <circle cx="70" cy="88" r="5" class="white-shine" opacity="0.95"/>
  
  <!-- Right Eye White Sparkle (Large) -->
  <circle cx="120" cy="88" r="5" class="white-shine" opacity="0.95"/>
  
  <!-- Left Eye Small Sparkle -->
  <circle cx="78" cy="92" r="2.5" class="white-shine" opacity="1"/>
  
  <!-- Right Eye Small Sparkle -->
  <circle cx="128" cy="92" r="2.5" class="white-shine" opacity="1"/>
  
  <!-- CELTIC CROSS MOUTH - WWE Championship Belt Inspired Diamond Brightness -->
  
  <!-- Vertical bar of Celtic Cross (mouth center) -->
  <rect x="95" y="125" width="10" height="35" class="neon-magenta" opacity="0.9"/>
  
  <!-- Horizontal bar of Celtic Cross (mouth width) -->
  <rect x="80" y="138" width="40" height="10" class="neon-magenta" opacity="0.9"/>
  
  <!-- Diamond accent gems on Celtic Cross - WWE Championship style -->
  <!-- Top center diamond -->
  <polygon points="100,120 104,126 100,132 96,126" fill="#FFD700" opacity="0.95" filter="brightness(1.3)"/>
  
  <!-- Left diamond -->
  <polygon points="75,142 81,146 75,150 69,146" fill="#FFD700" opacity="0.9"/>
  
  <!-- Right diamond -->
  <polygon points="125,142 131,146 125,150 119,146" fill="#FFD700" opacity="0.9"/>
  
  <!-- Bottom center diamond -->
  <polygon points="100,160 104,166 100,172 96,166" fill="#FFD700" opacity="0.95"/>
  
  <!-- Diamond corner accents for extra brilliance -->
  <polygon points="82,138 87,141 84,146 79,143" fill="#FFFF00" opacity="0.8"/>
  <polygon points="118,138 123,141 120,146 115,143" fill="#FFFF00" opacity="0.8"/>
  <polygon points="100,133 103,137 100,140 97,137" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="100,155 103,159 100,162 97,159" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Neon glow effect on cross -->
  <rect x="95" y="125" width="10" height="35" fill="none" stroke="#FF00FF" stroke-width="0.5" opacity="0.6"/>
  <rect x="80" y="138" width="40" height="10" fill="none" stroke="#FF00FF" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Star Sparkles around the blueberry -->
  
  <!-- Star 1 (top right) - Cyan -->
  <g transform="translate(155, 60)">
    <polygon points="0,-6 1.5,-2 6,-1.5 3,1.5 4,6 0,3 -4,6 -3,1.5 -6,-1.5 -1.5,-2" class="neon-cyan" opacity="0.9"/>
  </g>
  
  <!-- Star 2 (bottom left) - Cyan -->
  <g transform="translate(45, 155)">
    <polygon points="0,-5 1,-1.5 5,-1 2.5,1.5 3.5,5 0,2.5 -3.5,5 -2.5,1.5 -5,-1 -1,-1.5" class="neon-cyan" opacity="0.8"/>
  </g>
  
  <!-- Star 3 (top left) - Cyan -->
  <g transform="translate(50, 65)">
    <polygon points="0,-4 0.8,-1 4,-0.8 1.8,1 2.5,4 0,1.8 -2.5,4 -1.8,1 -4,-0.8 -0.8,-1" class="neon-cyan" opacity="0.7"/>
  </g>
  
  <!-- Star 4 (bottom right) - Green -->
  <g transform="translate(150, 150)">
    <polygon points="0,-5.5 1.2,-1.8 5.5,-1.5 2.8,1.8 3.8,5.5 0,2.8 -3.8,5.5 -2.8,1.8 -5.5,-1.5 -1.2,-1.8" class="neon-green" opacity="0.8"/>
  </g>
  
  <!-- Additional Small Sparkles for Extra Shimmer -->
  <circle cx="140" cy="80" r="2" class="neon-cyan" opacity="0.7"/>
  <circle cx="60" cy="140" r="2" class="neon-cyan" opacity="0.6"/>
  <circle cx="170" cy="120" r="1.5" class="neon-green" opacity="0.8"/>
  
  <!-- Outer Glow Rings -->
  <circle cx="100" cy="110" r="68" fill="none" stroke="#39FF14" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="110" r="70" fill="none" stroke="#00FF00" stroke-width="0.5" opacity="0.2"/>
</svg>